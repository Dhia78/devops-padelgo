apiVersion: apps/v1
kind: Deployment
metadata:
  name: padelgo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: padelgo-api
  template:
    metadata:
      labels:
        app: padelgo-api
    spec:
      serviceAccountName: padelgo-app-sa
      containers:
        - name: padelgo-api
          image: dhia78/padelgo-api:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
